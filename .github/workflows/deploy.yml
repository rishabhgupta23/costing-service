name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # Build project
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # Rename generated jar to a fixed name
      - name: Rename JAR
        run: |
          cp target/*.jar target/costing.jar

      # Upload only one jar
      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/costing.jar"
          target: "/home/ec2-user"

      # Deploy
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Stopping service..."
            sudo systemctl stop costing-app.service

            cd /home/ec2-user

            # Backup current jar
            if [ -f costing.jar ]; then
              cp costing.jar costing_backup_$(date +%s).jar
            fi

            # Keep only latest 3 backups
            ls -t costing_backup_*.jar 2>/dev/null | tail -n +4 | xargs -r rm -f

            # Replace jar uploaded by SCP
            mv target/costing.jar costing.jar

            echo "Starting service..."
            sudo systemctl start costing-app.service

            sudo systemctl status costing-app.service --no-pager