name: Deploy Spring Boot to EC2

on:
  push:
    branches:
      - release

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout Code
        uses: actions/checkout@v3

      # 2. Setup Java
      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Build JAR
      - name: Build with Maven
        run: mvn clean install -DskipTests

      # 4. Copy JAR to EC2
      - name: Upload JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "target/*.jar"
          target: "/home/ec2-user"

      # 5. SSH and restart service
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl stop wnw.service

            cd /home/ec2-user

            # 1. Create timestamp backup (if costing.jar exists)
            cp costing.jar costing_backup_$(date +%s).jar || true

            # 2. Keep only last 3 backups
            ls -t costing_backup_*.jar 2>/dev/null | tail -n +4 | xargs rm -f || true

            # 3. Replace with new JAR
            mv *.jar costing.jar

            # 4. Start service
            sudo systemctl start wnw.service

            # 5. Verify service
            sudo systemctl status wnw.service